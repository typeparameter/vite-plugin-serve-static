name: PR
on:
  pull_request_target:
    branches: [main]
    types:
      - opened
      - edited
      - synchronize
      - reopened

permissions:
  pull-requests: write

jobs:
  validate:
    name: Validate PR title
    runs-on: ubuntu-latest
    steps:
      - uses: typeparameter/actions/conventional-pr-title@main
