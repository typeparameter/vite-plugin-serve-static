name: CI
on: [pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install
      - run: pnpm build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install
      - run: pnpm lint
      - run: pnpm format:check

  test:
    name: Test (vite ${{ matrix.vite-version }}, node ${{ matrix.node-version }}, ${{ matrix.os }})
    strategy:
      matrix:
        include:
          - { vite-version: 5, node-version: 20, os: ubuntu-latest }
          - { vite-version: 6, node-version: 22, os: ubuntu-latest }
          - { vite-version: 7, node-version: 24, os: ubuntu-latest }
          - { vite-version: 8, node-version: 26, os: ubuntu-latest }
          - { vite-version: 5, node-version: 26, os: windows-latest }
          - { vite-version: 8, node-version: 26, os: windows-latest }
          - { vite-version: 5, node-version: 26, os: macos-latest }
          - { vite-version: 8, node-version: 26, os: macos-latest }
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install
      - run: pnpm -r add -D vite@^${{ matrix.vite-version }}
      - if: matrix.vite-version == 5
        run: pnpm -r add -D vitest@^2 # Use a compatible vitest version
      - run: pnpm test
